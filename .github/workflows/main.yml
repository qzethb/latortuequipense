name: IndexNow Submission

# L'envoi à IndexNow se fait APRÈS la génération du site (le sitemap est alors à jour),
# ou lors d'un push qui ne concerne pas les données d'articles.
on:
  workflow_run:
    workflows: ["Générer le site"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths-ignore:
      - "articles-data/**"
      - "articles-data-avenir/**"
      - "site-data/**"
      - "images/**"
  workflow_dispatch:

jobs:
  indexnow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Submit URLs to IndexNow
        run: |
          payload=$(python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap = ET.parse("sitemap.xml")
          urls = [node.text for node in sitemap.findall(".//sm:loc", namespace)]

          print(json.dumps({
              "host": "latortuequipense.fr",
              "key": "7f0ba42245a045668ce86277ba63e306",
              "keyLocation": "https://latortuequipense.fr/7f0ba42245a045668ce86277ba63e306.txt",
              "urlList": urls,
          }))
          PY
          )

          curl --fail-with-body --silent --show-error \
               -H "Content-Type: application/json; charset=utf-8" \
               -d "$payload" \
               "https://api.indexnow.org/IndexNow"
