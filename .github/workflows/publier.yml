name: Générateur d'Articles Statiques

on:
  push:
    paths:
      - 'articles-data/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Générer les fichiers HTML
        run: python scripts/generer_articles.py

      - name: Enregistrer les modifications sur main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ index.html articles.html sitemap.xml
          git diff --staged --quiet || git commit -m "🤖 Publication automatique d'un nouvel article et mise à jour du sitemap"
          git push