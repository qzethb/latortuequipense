name: Générer le site

# Se déclenche quand l'administration envoie un article, un « à venir » ou l'édito,
# et chaque jour à 6 h UTC pour publier les articles dont la date est atteinte.
on:
  push:
    branches: [main]
    paths:
      - "articles-data/**"
      - "articles-data-avenir/**"
      - "site-data/**"
      - "scripts/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Deux générations ne doivent jamais se chevaucher.
concurrency:
  group: generer-site
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publier les articles à venir dont la date est atteinte
        run: python scripts/promouvoir_articles.py

      - name: Générer les pages, les listes, l'édito et le sitemap
        run: python scripts/generer_articles.py

      - name: Enregistrer les changements
        run: |
          git add -A articles articles-data articles-data-avenir site-data index.html articles.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Génération automatique du site"
          git pull --rebase origin main
          git push origin main
