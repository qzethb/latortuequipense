name: Générer les articles

# Se déclenche quand la page d'administration envoie un nouvel article (articles-data/*.json),
# ou à la main depuis l'onglet « Actions » de GitHub.
on:
  push:
    branches: [main]
    paths:
      - "articles-data/**"
      - "scripts/generer_articles.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generer-articles
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les pages, les aperçus et le sitemap
        run: python scripts/generer_articles.py

      - name: Publier les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles index.html articles.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Génération automatique des articles"
            git pull --rebase origin main
            git push origin main
          fi